name: Bug report
description: 报告插件没有按预期工作
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先确认插件已启用，并且问题能在最新 `main` 分支上复现。

  - type: input
    id: desktop-version
    attributes:
      label: OpenCode Desktop 版本
      description: 在 OpenCode 的关于页面或安装包信息中查看。
      placeholder: 2.2.1
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本或 commit
      description: 可以填写版本号、commit hash，或本地目录的最后一次提交。
      placeholder: 0.1.0 / 5a4664e
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出能稳定复现问题的步骤。
      placeholder: |
        1. 打开包含表格的会话
        2. 点击「环境」列的漏斗
        3. 取消勾选「正式」
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 表格只保留「测试」两行。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 表格没有任何变化，控制台出现错误。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图或日志
      description: |
        可以在这里粘贴截图。需要日志时，请把插件配置改为对象形式并设置 `"debug": true`，
        然后附上 Desktop renderer 日志中的 `[filterable-table]` 相关行。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认没有重复报告。
          required: true
        - label: 我已经尝试最新 `main` 分支或最新版本。
          required: true
        - label: 我已经确认插件在 Settings > Extensions > Plugins 中处于启用状态。
          required: true
